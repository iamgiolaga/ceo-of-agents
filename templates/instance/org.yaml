schema: org/2
framework_version: {{FRAMEWORK_VERSION}}
org:
  id: {{ORG_ID}}
  name: {{ORG_NAME}}
  level: {{LEVEL}}              # company | holding
  purpose: {{PURPOSE}}          # job | product | startup | company
ceo:
  role_id: {{CEO_ROLE_ID}}      # the CEO is a role, not a hard-coded person
  display_name: "{{CEO_DISPLAY_NAME}}"   # optional
cos:
  display_name: "{{COS_DISPLAY_NAME}}"   # role name or persona, the CEO's choice
language:
  chat: {{CHAT_LANGUAGE}}       # language the CoS uses with the CEO
  files: {{FILE_LANGUAGE}}      # language of every file in hq
models:
  tiers: [opus, sonnet, haiku]  # most to least capable
  cos: {{MODEL_COS}}
  departments: {{MODEL_DEPARTMENTS}}   # applies to departments unless overridden below
  workers: one-down             # a rule, not a model: one tier below the parent; never escalate
# Zero departments is valid. Item shape:
#  - id: engineering            # kebab-case; files .claude/agents/<id>.md, departments/<id>/charter.md
#    from_catalog: engineering  # catalog id or "custom"
#    display_name: Engineering  # role name or persona, the CEO's choice
#    model: opus
#    connectors: []             # MCP tool patterns granted to this department only; none at setup
departments: {{DEPARTMENTS_YAML}}
gates:                          # action ids from the framework gate table
  free: {{GATES_FREE}}
  notice: {{GATES_NOTICE}}
  ok: {{GATES_OK}}
accounts:
  forbidden_connectors: []   # same account on every machine, added through a decision; per machine: accounts.local.yaml
# IF portfolio-company
policy: {{POLICY_YAML}}
# Either `null` (no holding policy) or:
#  repo: <git remote of the holding's policies repo>
#  local: <path to the CEO's local clone of the policies repo, read-only>
#  pin: <commit sha>
policies_repo: null
employer_rules: null
# END IF
# IF job
policy: null                    # a job hq is never governed by a holding
policies_repo: null
employer_rules: {{EMPLOYER_RULES}}
# null, or "<url or path of the employer's rules on data, AI tools and accounts>"
# END IF
# IF holding
policy: null
policies_repo: {{POLICIES_REPO_YAML}}
# A mapping:
#  local: <path to the policies repo on the CEO's machine, outside this hq>
#  remote: <git remote, or "" when none yet>
employer_rules: null
# END IF
