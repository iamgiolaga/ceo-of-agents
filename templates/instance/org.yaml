schema: org/1
framework_version: {{FRAMEWORK_VERSION}}
org:
  id: {{ORG_ID}}
  name: {{ORG_NAME}}
  level: {{LEVEL}}              # company | holding
ceo:
  role_id: {{CEO_ROLE_ID}}      # the CEO is a role, not a hard-coded person
  display_name: "{{CEO_DISPLAY_NAME}}"   # optional
language:
  chat: {{CHAT_LANGUAGE}}       # language the CoS uses with the CEO
  files: {{FILE_LANGUAGE}}      # language of every file in hq
models:
  tiers: [opus, sonnet, haiku]  # most to least capable
  cos: {{MODEL_COS}}
  departments: {{MODEL_DEPARTMENTS}}   # default for departments; per-department override below
  workers: one-down             # a rule, not a model: one tier below the parent; never escalate
# Zero departments is valid. Item shape:
#  - id: engineering            # kebab-case; files .claude/agents/<id>.md, departments/<id>/charter.md
#    from_catalog: engineering  # catalog id or "custom"
#    display_name: Engineering  # role name by default, persona optional
#    model: opus
#    connectors: []             # MCP tool patterns granted to this department only
departments: {{DEPARTMENTS_YAML}}
gates:                          # action ids from the framework default gates
  free: {{GATES_FREE}}
  notice: {{GATES_NOTICE}}
  ok: {{GATES_OK}}
accounts:
  forbidden_connectors: {{FORBIDDEN_CONNECTORS}}   # never usable by any agent of this org
# IF company
policy: {{POLICY_YAML}}
# Either `null` (no holding policy) or:
#  source: <holding hq git remote>
#  local: <path to the CEO's local clone of the holding hq, read-only>
#  path: policies/
#  pin: <commit sha>
# END IF
