<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="dg-title dg-desc">
  <title id="dg-title">How ceo-of-agents works</title>
  <desc id="dg-desc">You, the CEO, ask your chief of staff in plain language and get back a status and codes to approve. The chief of staff frames, routes, records and challenges, and routes work to departments such as engineering, design and brand, legal and finance (legal and finance are advisory). Departments work under tool allowlists. Everything is written to the hq repo, a git repo of markdown that holds the state and what waits on you, immutable decision records, and the approval gates: free (do it, mention it), notice (one line first), ok (waits for your OK).</desc>

  <defs>
    <marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/>
    </marker>
    <marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/>
    </marker>
  </defs>

  <!-- Solid background: identical in GitHub light and dark mode -->
  <rect x="0.5" y="0.5" width="1199" height="519" rx="20" fill="#0F172A" stroke="#334155"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="56" font-size="22" font-weight="700" fill="#F8FAFC">How it works</text>
    <text x="40" y="82" font-size="15" fill="#94A3B8">Everything lands in one git repo you own.</text>
  </g>

  <!-- CoS records into hq -->
  <path d="M450 178 V100 Q450 88 462 88 H1058 Q1070 88 1070 100 V106" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ah-teal)"/>

  <!-- CEO <-> CoS -->
  <line x1="222" y1="226" x2="326" y2="226" stroke="#2DD4BF" stroke-width="2" marker-end="url(#ah-teal)"/>
  <line x1="326" y1="256" x2="224" y2="256" stroke="#A78BFA" stroke-width="2" marker-end="url(#ah-violet)"/>

  <!-- CoS -> departments -->
  <g stroke="#2DD4BF" stroke-width="2" fill="none">
    <line x1="570" y1="240" x2="620" y2="240"/>
    <line x1="620" y1="136" x2="620" y2="334"/>
    <line x1="620" y1="136" x2="678" y2="136" marker-end="url(#ah-teal)"/>
    <line x1="620" y1="202" x2="678" y2="202" marker-end="url(#ah-teal)"/>
    <line x1="620" y1="268" x2="678" y2="268" marker-end="url(#ah-teal)"/>
    <line x1="620" y1="334" x2="678" y2="334" marker-end="url(#ah-teal)"/>
  </g>

  <!-- departments -> hq -->
  <g stroke="#2DD4BF" stroke-width="2" fill="none">
    <line x1="900" y1="136" x2="918" y2="136"/>
    <line x1="900" y1="202" x2="918" y2="202"/>
    <line x1="900" y1="268" x2="918" y2="268"/>
    <line x1="900" y1="334" x2="918" y2="334"/>
    <line x1="918" y1="136" x2="918" y2="334"/>
    <line x1="918" y1="235" x2="978" y2="235" marker-end="url(#ah-teal)"/>
  </g>

  <!-- Arrow labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#94A3B8" text-anchor="middle">
    <text x="274" y="216">asks</text>
    <text x="274" y="278">codes to OK</text>
    <text x="620" y="122">routes</text>
    <text x="949" y="226">writes</text>
    <text x="760" y="78">records every decision</text>
  </g>

  <!-- CEO -->
  <rect x="40" y="196" width="180" height="88" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/>
  <!-- CoS -->
  <rect x="330" y="180" width="240" height="120" rx="14" fill="#2DD4BF"/>
  <!-- Departments -->
  <g fill="#1E293B" stroke="#334155" stroke-width="1.5">
    <rect x="680" y="110" width="220" height="52" rx="10"/>
    <rect x="680" y="176" width="220" height="52" rx="10"/>
    <rect x="680" y="242" width="220" height="52" rx="10"/>
    <rect x="680" y="308" width="220" height="52" rx="10"/>
  </g>
  <!-- hq -->
  <rect x="980" y="110" width="180" height="250" rx="14" fill="#1E293B" stroke="#2DD4BF" stroke-width="2"/>
  <g fill="#0F172A" stroke="#334155" stroke-width="1.5">
    <rect x="996" y="176" width="148" height="54" rx="8"/>
    <rect x="996" y="238" width="148" height="54" rx="8"/>
    <rect x="996" y="300" width="148" height="54" rx="8"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- CEO text -->
    <text x="130" y="234" text-anchor="middle" font-size="22" font-weight="700" fill="#F8FAFC">You</text>
    <text x="130" y="260" text-anchor="middle" font-size="15" fill="#94A3B8">the CEO</text>
    <text x="130" y="318" text-anchor="middle" font-size="15" fill="#94A3B8">plain language</text>

    <!-- CoS text -->
    <text x="450" y="226" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Chief of staff</text>
    <text x="450" y="254" text-anchor="middle" font-size="15" fill="#0F172A">frames, routes,</text>
    <text x="450" y="276" text-anchor="middle" font-size="15" fill="#0F172A">records, challenges</text>
    <text x="450" y="330" text-anchor="middle" font-size="15" fill="#94A3B8">your one entry point</text>

    <!-- Department text -->
    <text x="700" y="142" font-size="16" fill="#F8FAFC">Engineering</text>
    <text x="700" y="208" font-size="16" fill="#F8FAFC">Design and brand</text>
    <text x="700" y="274" font-size="16" fill="#F8FAFC">Legal</text>
    <text x="884" y="274" text-anchor="end" font-size="13" fill="#94A3B8">advisory</text>
    <text x="700" y="340" font-size="16" fill="#F8FAFC">Finance</text>
    <text x="884" y="340" text-anchor="end" font-size="13" fill="#94A3B8">advisory</text>
    <text x="790" y="392" text-anchor="middle" font-size="15" fill="#94A3B8">specialists with tool allowlists</text>

    <!-- hq text -->
    <text x="1070" y="162" text-anchor="middle" font-size="13" fill="#94A3B8">git + markdown</text>
    <text x="1070" y="219" text-anchor="middle" font-size="13" fill="#94A3B8">what waits on you</text>
    <text x="1070" y="281" text-anchor="middle" font-size="13" fill="#94A3B8">immutable records</text>
    <text x="1070" y="343" text-anchor="middle" font-size="13" fill="#94A3B8">free, notice, ok</text>
    <text x="1070" y="392" text-anchor="middle" font-size="15" fill="#94A3B8">single source of truth</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">
    <text x="1070" y="142" font-size="18" font-weight="700" fill="#2DD4BF">hq repo</text>
    <text x="1070" y="200" font-size="15" fill="#F8FAFC">state</text>
    <text x="1070" y="262" font-size="15" fill="#F8FAFC">decisions</text>
    <text x="1070" y="324" font-size="15" fill="#F8FAFC">gates</text>
  </g>

  <!-- Approval gates legend -->
  <rect x="40" y="424" width="1120" height="60" rx="12" fill="#1E293B" stroke="#334155"/>
  <g font-size="15">
    <text x="64" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" fill="#F8FAFC">Approval gates</text>
    <text x="260" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="700" fill="#2DD4BF">free</text>
    <text x="310" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#94A3B8">do it, mention it</text>
    <text x="540" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="700" fill="#2DD4BF">notice</text>
    <text x="612" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#94A3B8">one line first</text>
    <text x="820" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="700" fill="#A78BFA">ok</text>
    <text x="852" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#94A3B8">waits for your OK</text>
  </g>
</svg>
