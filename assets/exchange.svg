<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="ex-title ex-desc">
  <title id="ex-title">A typical exchange with your chief of staff</title>
  <desc id="ex-desc">You say "I have an idea: a referral program for early users." The chief of staff frames it, checks for duplicates, picks the route (a task for a department, a decision card or a note) and runs it. You say "Decide whether we keep the free tier." It writes a decision card and adds ACME-D3 to your list. You say "ACME-D3: option b." It records the decision, clears the card and updates the state. You say "Pass to engineering: why did the last release fail?" It forwards the question, returns engineering's answer and adds its own view.</desc>

  <defs>
    <marker id="ex-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <!-- Solid background: identical in GitHub light and dark mode -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="#0F172A" stroke="#334155"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">
    <text x="40" y="48" fill="#A78BFA">YOU SAY</text>
    <text x="620" y="48" fill="#2DD4BF">YOUR CHIEF OF STAFF DOES</text>
  </g>

  <!-- You say -->
  <g fill="#1E293B" stroke="#A78BFA" stroke-width="1.5">
    <rect x="40" y="72" width="500" height="56" rx="12"/>
    <rect x="40" y="140" width="500" height="56" rx="12"/>
    <rect x="40" y="208" width="500" height="56" rx="12"/>
    <rect x="40" y="276" width="500" height="56" rx="12"/>
  </g>
  <!-- CoS does -->
  <g fill="#1E293B" stroke="#334155" stroke-width="1.5">
    <rect x="620" y="72" width="540" height="56" rx="12"/>
    <rect x="620" y="140" width="540" height="56" rx="12"/>
    <rect x="620" y="208" width="540" height="56" rx="12"/>
    <rect x="620" y="276" width="540" height="56" rx="12"/>
  </g>
  <g stroke="#2DD4BF" stroke-width="2">
    <line x1="550" y1="100" x2="610" y2="100" marker-end="url(#ex-ah)"/>
    <line x1="550" y1="168" x2="610" y2="168" marker-end="url(#ex-ah)"/>
    <line x1="550" y1="236" x2="610" y2="236" marker-end="url(#ex-ah)"/>
    <line x1="550" y1="304" x2="610" y2="304" marker-end="url(#ex-ah)"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#F8FAFC">
    <g font-size="16">
      <text x="60" y="106">"I have an idea: a referral program for early users."</text>
      <text x="60" y="174">"Decide whether we keep the free tier."</text>
      <text x="60" y="242">"ACME-D3: option b."</text>
      <text x="60" y="310">"Pass to engineering: why did the last release fail?"</text>
    </g>
    <g font-size="15">
      <text x="640" y="106">Frames it, checks for duplicates, picks the route and runs it</text>
      <text x="640" y="174">Writes a decision card, adds <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#2DD4BF">ACME-D3</tspan> to your list</text>
      <text x="640" y="242">Records the decision, clears the card, updates the state</text>
      <text x="640" y="310">Forwards it, returns engineering's answer, adds its view</text>
    </g>
  </g>
</svg>
