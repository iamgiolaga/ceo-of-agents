# Schema: org.yaml (`org/4`)
#
# Instance configuration of one org. Lives at the hq root. Annotated example below
# is itself valid YAML. Owner: the CoS, changed only by a normal hq commit.
#
# Required keys: schema, framework_version, org, ceo, cos, language, models,
#                departments, gates, accounts, repos, tracker
# Optional keys: policy (company level, purpose product, startup or company; null when unused),
#                policies_repo (holding level only; null for a company),
#                employer_rules (job only; null otherwise)
#
# Allowed values and rules
#   schema                  exactly "org/4"
#   framework_version       framework version the instance was generated from
#   org.id                  2-8 characters, A-Z and 0-9, starts with a letter
#   org.name                free text
#   org.level               company | holding
#   org.purpose             job | product | startup | company | personal
#                             job: the CEO's own work at an employer
#                             product: one product the CEO builds
#                             startup: a startup the CEO is founding or running
#                             company: a company the CEO runs; at holding level, the
#                             CEO's affairs as an entrepreneur across their orgs
#                             personal: the CEO's own personal life (company level
#                             only); personal data lives in the git-ignored private/
#                             folder of the hq, never in tracked files
#   ceo.role_id             role id for the CEO (for example "ceo"); a role, not a person
#   ceo.display_name        optional free text, may be ""
#   cos.display_name        required, non-empty; the role name ("Chief of staff") or a
#                           persona name, the CEO's choice (same rule as department
#                           display names)
#   language.chat           language the CoS uses with the CEO (ISO 639-1 code)
#   language.files          language of every file in hq (ISO 639-1 code)
#   models.tiers            list, most to least capable
#   models.cos              one of models.tiers
#   models.departments      one of models.tiers; applies to departments unless overridden
#   models.workers          "one-down" (one tier below the parent; never escalate)
#   departments             list, zero items is valid; item fields:
#     id                    kebab-case; departments/<id>/charter.md, decision cards
#                           and handoffs
#     agent                 required; the agent name: lowercase kebab-case,
#                           ^[a-z][a-z0-9-]*$. The persona slug when display_name is a
#                           persona, otherwise equal to id. The agent file is
#                           .claude/agents/<agent>.md. Unique; never another
#                           department's id, never "reader" or "worker"
#     from_catalog          a catalog id (engineering, design-brand, business,
#                           growth-social, legal, finance, tax, operations; and
#                           health, money, paperwork in a personal hq only) or "custom"
#     display_name          role name or a persona name, the CEO's choice
#     model                 one of models.tiers
#     workers               optional. Absent = follow models.workers (one-down). "same" =
#                           "top model, workers included": allowed only when the
#                           department model is the first entry of models.tiers; its
#                           workers run on that same tier, never above it
#     connectors            MCP tool patterns granted to this department only,
#                           e.g. mcp__github__*; [] for none. The wizard writes []:
#                           connectors are granted later, through a decision
#   gates                   three lists of action ids, see gates/default.md;
#                           every action id appears in exactly one list
#   accounts.forbidden_connectors   optional list of connector patterns no agent of this
#                           org may use. The wizard writes []; entries are added later,
#                           through a decision
#   repos                   registry of the org's product repos; [] for none (always [] in
#                           a holding and in a personal hq). Charters, agents and skills read this list and
#                           never copy it. Item fields:
#     slug                  full GitHub slug "owner/name"; owners may differ (a GitHub
#                           org, a personal account, or both)
#     role                  short free text: code, site, docs, hq, ...
#     visibility            public | private. Public repos never receive internal names,
#                           codes or hq content
#     issues_home           true for exactly one item when the list is not empty: the repo
#                           that holds cross-cutting issues (may be the hq itself, role hq);
#                           false for the others
#     planned               optional. Absent = the repo exists. true = the user plans to
#                           create it: agents skip issue and tracker writes to it (one
#                           line, not a failure) until it exists, and an action item asks
#                           the user to create it. The CoS removes the key once
#                           `gh repo view` finds it. A planned repo is never cloned, so it
#                           gets no repo_paths entry
#                           Local clone paths are per machine and are not stored here: they
#                           live under repo_paths in accounts.local.yaml (not tracked by
#                           git), written by the CoS on each machine
#   tracker                 "none", or a mapping (always "none" in a holding and in a
#                           personal hq):
#     kind                  github-project
#     owner                 login of the GitHub org or user that owns the Project. A user
#                           Project can hold issues from repos of different owners
#     number                the Project number (an integer, from its URL)
#     status_field          name of the single-select status field, for example "Status"
#   policy                  company level, purpose product, startup or company; null, or
#                           a mapping:
#     repo                  git remote URL of the holding's policies repo, or "" when
#                           it has no remote yet (the CoS reads only local and pin)
#     local                 CEO's local clone of the policies repo, read-only
#     pin                   commit sha the policy.yaml is read from
#   policies_repo           holding only; null for a company; a mapping:
#     local                 path to the policies repo on the CEO's machine
#                           (a separate repo outside the hq)
#     remote                its git remote, or "" when none yet
#   employer_rules          optional; null, or a quoted string: URL or local path of the
#                           employer's rules on data, AI tools and accounts. Job only;
#                           null for every other purpose and for a holding. Informational
#                           pointer: the CoS reads it on demand, nothing is copied into hq

schema: org/4
framework_version: 0.10.0
org:
  id: ACME
  name: Acme
  level: company
  purpose: product
ceo:
  role_id: ceo
  display_name: ""
cos:
  display_name: Chief of staff
language:
  chat: en
  files: en
models:
  tiers: [opus, sonnet, haiku]
  cos: opus
  departments: opus
  workers: one-down
departments:
  - id: engineering
    agent: mike
    from_catalog: engineering
    display_name: Mike
    model: opus
    connectors: []
gates:
  free: [issues-and-labels, comments, drafts, open-pr, research, hq-write]
  notice: [push-non-deploy-branch, hq-commit, dispatch-pushing-department]
  ok: [merge, deploy, publish, contact-people, spend-money, rotate-secrets, delete-data, org-or-repo-settings, change-brand-rules, change-policy-rules, file-or-sign, make-payment]
accounts:
  forbidden_connectors: []
repos:
  - slug: acme/acme-app
    role: code
    visibility: public
    issues_home: false
  - slug: acme/hq
    role: hq
    visibility: private
    issues_home: true
tracker:
  kind: github-project
  owner: acme
  number: 1
  status_field: Status
policy: null
policies_repo: null
employer_rules: null
# Without product repos or a tracker:
# repos: []
# tracker: none
# Example of a policy block (company only):
# policy:
#   repo: <policies repo git remote>
#   local: ~/path/to/policies-repo
#   pin: <commit sha>
# Example of a policies_repo block (holding only; then policy is null):
# policies_repo:
#   local: ~/path/to/policies-repo
#   remote: <git remote, or "" when none yet>
# Example of employer_rules (job only; then policy is null):
# employer_rules: "https://intranet.example.com/rules-on-data-and-ai"

# Validation checklist
#   - Parses as YAML; all required keys present; schema is "org/4".
#   - org.id matches ^[A-Z][A-Z0-9]{1,7}$ and equals org_id in company/state.md.
#   - org.level is company or holding; policy is null when level is holding;
#     policies_repo is null when level is company.
#   - org.purpose is job, product, startup, company or personal. Level holding requires
#     purpose company; purpose job, product, startup or personal requires level company.
#   - Purpose job or personal requires policy null (never governed by a holding) and is
#     never registered in a holding portfolio.yaml.
#   - Purpose personal requires repos [] and tracker none. Catalog ids health, money and
#     paperwork appear only with purpose personal.
#   - cos.display_name is present and non-empty.
#   - employer_rules is null unless org.purpose is job.
#   - models.cos, models.departments and every department model are in models.tiers.
#   - models.workers is one-down; no worker model is more capable than its parent.
#   - A department with workers: same has a model equal to the first entry of
#     models.tiers; any other value of workers is invalid.
#   - Department ids are unique kebab-case; each has a matching charter
#     (departments/<id>/charter.md).
#   - Each department has an agent matching ^[a-z][a-z0-9-]*$, unique, not equal to another
#     department's id, "reader" or "worker". The file .claude/agents/<agent>.md exists and
#     its name: equals the file name and agent.
#   - No connector pattern appears both in a department connectors list and in
#     accounts.forbidden_connectors.
#   - Every gate action id is known (see gates/default.md) and listed exactly once.
#   - Advisory departments (legal, finance, tax, health, money, paperwork) never have
#     file-or-sign or make-payment outside the ok list.
#   - framework_version equals the version in company/state.md frontmatter, unless a
#     migration is pending.
#   - repos: every slug matches ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ and is unique; visibility
#     is public or private; exactly one item has issues_home true when the list is not
#     empty. A holding has repos [] and tracker none. No item holds a local path.
#   - repos: planned, when present, is true; a planned repo has no repo_paths entry.
#   - tracker is "none" or has kind github-project, a non-empty owner, an integer number
#     and a non-empty status_field.
#   - An `org/1` file is read as purpose company with the CoS name unset until migrated
#     (see migrations/0.1.1-to-0.2.0.md). An `org/2` file is read as repos [] and
#     tracker none until migrated (see migrations/0.5.0-to-0.6.0.md). An `org/3` file (or
#     older) is read as agent equal to id for every department until migrated (see
#     migrations/0.6.0-to-0.7.0.md).
