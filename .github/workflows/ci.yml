name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML (pinned by hash)
        run: python -m pip install --disable-pip-version-check --require-hashes -r scripts/ci/requirements.txt

      - name: JSON, YAML and frontmatter parse
        run: python scripts/ci/check_syntax.py

      - name: Plugin manifest and marketplace file
        if: ${{ !cancelled() }}
        run: python scripts/ci/check_manifest.py

      - name: Every version has its migration
        if: ${{ !cancelled() }}
        run: python scripts/ci/check_migrations.py

      - name: Relative links in Markdown
        if: ${{ !cancelled() }}
        run: python scripts/ci/check_links.py
