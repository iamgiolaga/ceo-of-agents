name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|perf|test|build|ci|style|revert)(\([a-z0-9][a-z0-9-]*\))?!?: [^ ].*[^. ]$'
          if printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "Conventional Commit title: $TITLE"
          else
            echo "::error title=PR title::The title is not a Conventional Commit title. Use 'type(optional-scope): summary' with type feat, fix, docs, chore, refactor, perf, test, build, ci, style or revert; add '!' before ':' for a breaking change; no full stop at the end. See CONTRIBUTING.md."
            echo "Title was: $TITLE"
            exit 1
          fi
